<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typing Games – Typowizz</title>
<meta name="description" content="Play free typing games: Word Rain, Speed Burst, Scramble Dash and Letter Blitz.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="fx"><i style="left:-80px;top:10%;background:#00b4ff"></i><i style="right:-100px;top:35%;background:#ff4fd8;animation-delay:-3s"></i><i style="left:30%;bottom:-120px;background:#7c5cff;animation-delay:-6s"></i></div>
<header><nav class="pill"><a class="logo" href="index.html" style="color:var(--tx)">⌨ typowizz</a><span class="links"><a href="index.html">🏠 Home</a><a href="games.html" class=on>🎮 Games</a><a href="about.html">👤 About</a><a href="open-source.html">💻 Open Source</a><a href="terms.html">📜 Terms</a></span></nav></header>
<main>
<section class="on">
  <div style="text-align:center;padding:30px 0 6px"><h1>Typing <em>games</em></h1><p class="mut">Pick a game, choose a level and time, then start.</p></div>
  <div id="glist" class="grid"></div>
  <div id="gset" class="card" hidden>
    <div class="ic" id="gic"></div><h2 id="gt" style="margin-top:10px"></h2><p id="gd"></p>
    <div class="row"><span class="lbl">Level</span><span class="seg" id="glv"></span></div>
    <div class="row"><span class="lbl">Time</span><span class="seg" id="gtm"></span></div>
    <div class="row"><button class="btn pri" id="gstart">▶ Start game</button><button class="btn" id="gback">← All games</button></div>
  </div>
  <div id="garena" class="stage" hidden><div class="bg"></div><div class="in">
    <div class="gh"><span id="gn"></span><button class="btn sm" id="gquit">✕ Quit</button></div>
    <div class="stats"><div class="stat"><b id="gS">0</b><span>Score</span></div><div class="stat"><b id="gT">0</b><span>Seconds</span></div><div class="stat"><b id="gX">0</b><span id="gXl">Lives</span></div></div>
    <div class="sky" id="sky"></div><div class="big" id="cur"></div>
    <input type="text" id="gi" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="fb" class="fb"></div><div id="gres" class="row"></div>
  </div></div>
</section>
</main>
<div id="modal" hidden><div class="mcard" id="mc"></div></div>
<footer>© 2026 Typowizz · MIT licensed · Built by <a href="https://github.com/bitqwel" target="_blank" rel="noopener">@bitqwel</a></footer>

<script src="js/games.js"></script>
</body>
</html>
